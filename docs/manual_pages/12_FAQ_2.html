<h1>常见问题（二）</h1>
<h2>为什么没有立体 3D？</h2>
<p>Old 3DS 不支持。New 3DS 在设置里开，当前版本立体渲染未启用，开关预留。</p>
<h2>怎么把电脑上的游戏搬上卡？</h2>
<p>更多 - 从电脑取文件，那是唯一入口。</p>
<h2>模型让我做危险操作怎么办？</h2>
<p>白名单外的事执行层不认。确认屏上会写完整事实，不确定就拒绝。</p>
<h2>更新装了一半不动了？</h2>
<p>更新屏有分段进度；中断不会写坏原文件，先校验后安装。</p>
<h2>说明书里为什么没有图片？</h2>
<p>内置查看器是 HTML 子集，不支持图片。配图在仓库文档里，App 内展示要等单独的贴图机制。</p>
