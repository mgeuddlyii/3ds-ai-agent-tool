<h1>故障排查</h1>
<h2>现象对照</h2>
<ul>
<li>主界面显示没配凭据：检查 key.txt 是否在 SD:/3ds/aiconsole/ 下，再看服务目录的凭据状态。</li>
<li>发送后一直转：等服务商响应，超时会回到对话屏，看 status.txt 连接诊断。</li>
<li>语音没反应：按住 ZL 再说话，说满 0.5 秒，看 status.txt 麦克风诊断。</li>
<li>攻略答案像串了：关键词太泛，缩小游戏范围。</li>
<li>装程序后主菜单没图标：.cia 要去 FBI 里点一下，看 cias/ 文件夹。</li>
<li>设置改了不生效：主题即时生效，安全等级看本会话，重启程序。</li>
</ul>
