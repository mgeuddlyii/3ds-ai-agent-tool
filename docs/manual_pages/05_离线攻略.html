<h1>离线攻略</h1>
<p>不联网、不用 Key 的内置攻略检索。</p>
<h2>覆盖</h2>
<ul>
<li>211 款游戏的 FAQ 与流程段落。</li>
<li>命中段落原文直出，不编答案。</li>
<li>内置微模型（1.18M 参数）加 BM25，全程在卡上跑。</li>
</ul>
<h2>怎么用</h2>
<ol>
<li>主界面进「离线攻略」。</li>
<li>按 Y 打开键盘输入问题。</li>
<li>结果直接显示；可限定游戏范围缩小检索面。</li>
</ol>
<h2>状态说明</h2>
<p>显示「词表加载失败，检索不可用」时重启程序重试；仍不行看 SD:/3ds/aiconsole/status.txt 里的诊断行。</p>
