<h1>设置</h1>
<p>五组设置，另有安全等级。</p>
<h2>界面</h2>
<ul>
<li>主题：白昼 / 黑夜。</li>
<li>立体深度：当前版本未启用立体渲染，调了暂时没效果。</li>
<li>语言。</li>
</ul>
<h2>AI</h2>
<ul>
<li>默认服务商、模型、回复长度（短 / 标准 / 长）。</li>
<li>上下文轮数、记忆（可清空）。</li>
</ul>
<h2>提醒</h2>
<ul>
<li>NAND 备份提醒开关、更新自动检查开关。</li>
</ul>
<h2>闸门</h2>
<ul>
<li>删除前确认、批量操作前确认。</li>
<li>单次写入大小上限、批量文件数上限。</li>
</ul>
<h2>诊断</h2>
<ul>
<li>布局溢出提示、备注显示、详细状态输出。</li>
</ul>
<h2>安全等级</h2>
<p>默认 L0 对话级，退出后不保留。每次启动从最低等级开始，要用高级等级得手动调。详见安全说明两页。</p>
