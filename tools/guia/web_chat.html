<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地攻略 AI</title>
<style>
/* 白底 + 青色主色。轻量，纯 CSS，无外部字体/CDN —— 断网可用。 */
:root{
  --bg:#ffffff; --panel:#f7f9fa; --line:#e2e8ea;
  --teal:#0f9b8e; --teal-dk:#0b7a70; --teal-lt:#e6f6f4;
  --ink:#1c2224; --ink-2:#5b6a6d; --ink-3:#8b989b;
  --warn:#b26a00; --warn-bg:#fdf5e6;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.65 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  display:flex; flex-direction:column;
}
header{
  padding:12px 20px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:var(--bg);
}
header h1{font-size:16px;font-weight:500;margin:0;white-space:nowrap}
.badge{
  font-size:12px; color:var(--teal-dk); background:var(--teal-lt);
  border:1px solid #c9e8e4; border-radius:999px; padding:2px 10px; white-space:nowrap;
}
.badge.gray{color:var(--ink-2);background:var(--panel);border-color:var(--line)}
#stat{font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap}

main{flex:1;overflow-y:auto;padding:20px}
.wrap{max-width:820px;margin:0 auto}

.row{margin-bottom:18px;display:flex}
.row.me{justify-content:flex-end}
.bubble{
  max-width:78%;padding:10px 14px;border-radius:var(--radius);
  white-space:pre-wrap;word-break:break-word;
}
.row.me .bubble{background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.row.ai .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}

.meta{font-size:12px;color:var(--ink-3);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.row.me .meta{justify-content:flex-end}

details.src{margin-top:8px}
details.src>summary{
  font-size:12px;color:var(--teal-dk);cursor:pointer;user-select:none;
  list-style:none;padding:2px 0;
}
details.src>summary::-webkit-details-marker{display:none}
details.src>summary::before{content:"▸ ";color:var(--ink-3)}
details.src[open]>summary::before{content:"▾ "}
details.src>summary:hover{color:var(--teal)}
.srch{
  margin-top:6px;font-size:12px;color:var(--ink-2);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;
}
.srch div{margin-bottom:6px}
.srch div:last-child{margin-bottom:0}
.srch b{color:var(--teal-dk);font-weight:500}

.note{
  margin-top:8px;font-size:12px;line-height:1.6;color:var(--warn);
  background:var(--warn-bg);border:1px solid #f0dfbb;border-radius:8px;padding:7px 10px;
}

footer{border-top:1px solid var(--line);background:var(--bg);padding:12px 20px}
.fwrap{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select{
  font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--ink);max-width:190px;
}
input[type=text]{
  flex:1;min-width:220px;font:inherit;padding:10px 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);
}
input[type=text]:focus{outline:none;border-color:var(--teal)}
button{
  font:inherit;font-size:14px;padding:10px 18px;border:none;border-radius:8px;
  background:var(--teal);color:#fff;cursor:pointer;white-space:nowrap;
}
button:hover:not(:disabled){background:var(--teal-dk)}
button:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:12px;color:var(--ink-3);margin-top:7px;line-height:1.6}
.hint b{color:var(--ink-2);font-weight:500}
.err{color:#b3261e}
</style>
</head>
<body>

<header>
  <h1>本地攻略 AI</h1>
  <span class="badge">31 款游戏 · 1174 段语料</span>
  <span class="badge gray">不联网 · 零积分</span>
  <span id="stat">加载中…</span>
</header>

<main id="log"><div class="wrap" id="msgs"></div></main>

<footer>
  <div class="wrap">
    <div class="fwrap">
      <select id="game" title="限定游戏（留空=自动识别）"><option value="">自动识别游戏</option></select>
      <input type="text" id="q" placeholder="问点什么，例如：转职怎么转 / 沙之杖怎么用" autocomplete="off">
      <button id="send">发送</button>
    </div>
    <div class="hint">
      <b>答案来自本地语料，逐字拷贝</b>，不是模型编的 —— 所以不会说错，但也不会超出语料范围。
      带上道具名、动作名或游戏名会准得多。
    </div>
  </div>
</footer>

<script>
var msgs = document.getElementById('msgs');
var log  = document.getElementById('log');
var inp  = document.getElementById('q');
var btn  = document.getElementById('send');
var sel  = document.getElementById('game');
var stat = document.getElementById('stat');
var busy = false;

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function scroll(){ log.scrollTop = log.scrollHeight; }

/* 一条用户消息 */
function addMe(text){
  var d = document.createElement('div');
  d.className = 'row me';
  d.innerHTML = '<div><div class="bubble">' + esc(text) + '</div></div>';
  msgs.appendChild(d); scroll();
}

/* 一条 AI 回复。hits 用来做「查看来源」。 */
function addAI(r, q){
  var d = document.createElement('div');
  d.className = 'row ai';

  var meta = [];
  if (r.game) meta.push('游戏 ' + esc(r.game));
  if (r.n_cand) meta.push('候选句 ' + r.n_cand + ' · 取 ' + (r.n_pick||0) + ' 句');
  /* ★ 这里原来显示「覆盖 命中/未命中」，实测发现它**不能代表答对了**：
     cov=1 只说明「某个实体词窗口出现在句里」，而那个实体词可能是通用词。
     实测「适合新手吗」cov=1 但答的是御三家；反过来「职业怎么转」
     （真想問「转职」）cov=1 却没提到转职 —— 两者与对错没有稳定对应。
     → 所以只说「含你问的词」这个**事实**，不冒充准确度。 */
  meta.push(r.matched ? '含你问的词' : '未含你问的词');
  if (typeof r.ms === 'number') meta.push(r.ms + ' ms');

  var src = '';
  if (r.hits && r.hits.length){
    var h = '';
    for (var i=0;i<r.hits.length;i++){
      h += '<div><b>#' + r.hits[i].pid + '</b> ' + esc(r.hits[i].text) + '</div>';
    }
    src = '<details class="src"><summary>查看来源段落（' + r.hits.length + '）</summary>'
        + '<div class="srch">' + h + '</div></details>';
  }
  var note = r.note ? '<div class="note">' + esc(r.note) + '</div>' : '';

  d.innerHTML = '<div><div class="bubble">' + esc(r.answer) + '</div>'
              + (note ? note : '')
              + src
              + '<div class="meta">' + meta.join('<span>·</span>') + '</div></div>';
  msgs.appendChild(d); scroll();
}

function addErr(msg){
  var d = document.createElement('div');
  d.className = 'row ai';
  d.innerHTML = '<div><div class="bubble err">' + esc(msg) + '</div></div>';
  msgs.appendChild(d); scroll();
}

function ask(text){
  if (busy) return;
  var q = text;
  if (q === undefined){
    q = inp.value.trim();
    if (!q) return;
    inp.value = '';
  }
  addMe(q);
  busy = true; btn.disabled = true;
  stat.textContent = '思考中…';

  fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({q: q, game: sel.value || null})
  })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if (j && j.ok === false) addErr(j.error || '出错');
    else addAI(j || {}, q);
    stat.textContent = '就绪';
  })
  .catch(function(e){
    addErr('连不上本地服务：' + e + ' —— 后端是不是没起？（在 tools/guia 下跑 python web_chat_server.py）');
    stat.textContent = '服务未连接';
  })
  .then(function(){
    busy = false; btn.disabled = false; inp.focus();
  });
}

btn.addEventListener('click', function(){ ask(); });
inp.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(); }
});

/* 初始化：健康检查 + 游戏列表 + 几个能直接点的例子 */
fetch('/api/health').then(function(r){ return r.json(); }).then(function(j){
  if (j && j.ok){
    stat.textContent = j.passages + ' 段落 · ' + j.games + ' 款游戏 · 就绪';
  } else {
    stat.textContent = '服务异常';
  }
}).catch(function(){
  stat.textContent = '服务未连接';
  addErr('后端没连上。在 3ds-ai/tools/guia 下跑：python web_chat_server.py');
});

fetch('/api/games').then(function(r){ return r.json(); }).then(function(j){
  if (!j || !j.games) return;
  for (var i=0;i<j.games.length;i++){
    var o = document.createElement('option');
    o.value = j.games[i].id;
    o.textContent = j.games[i].id;
    sel.appendChild(o);
  }
}).catch(function(){});

/* 开场白 + 示例 */
(function(){
  var d = document.createElement('div');
  d.className = 'row ai';
  d.innerHTML = '<div><div class="bubble">'
    + '我在本地语料里查 31 款游戏的攻略要点。\n\n'
    + '我的答案都是从语料原句里挑出来的，不会自己编 —— 所以不会说错，'
    + '但语料里没有的我也不知道。\n\n'
    + '试试下面这些，或者直接问：'
    + '</div><div class="note">'
    + '提示：带上游戏名或道具名最准。'
    + '不含实体词的问题（比如「这游戏好玩吗」）我只能给你语料里最相关的几句话，'
    + '那不算是「答对了」。'
    + '</div></div>';
  msgs.appendChild(d);

  var ex = ['火焰纹章觉醒 转职怎么转','时之笛 钩索箭哪里拿','怪物猎人4G 弱点是什么',
            '路易吉洋馆2 吸尘器怎么用','沙之杖怎么用','大师之剑在哪里拿'];
  var box = document.createElement('div');
  box.className = 'row ai';
  var h = '<div style="display:flex;flex-wrap:wrap;gap:8px">';
  for (var i=0;i<ex.length;i++){
    h += '<button data-q="' + esc(ex[i]) + '" style="font-size:12px;padding:6px 12px;'
       + 'background:var(--teal-lt);color:var(--teal-dk)">' + esc(ex[i]) + '</button>';
  }
  h += '</div>';
  box.innerHTML = '<div>' + h + '</div>';
  msgs.appendChild(box);
  for (var j=0;j<box.querySelectorAll('button').length;j++){
    (function(btnEl){
      btnEl.addEventListener('click', function(){ ask(btnEl.getAttribute('data-q')); });
    })(box.querySelectorAll('button')[j]);
  }
  scroll();
})();

inp.focus();
</script>
</body>
</html>
